<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151515">
  <title>Apurador de Renda | M&IC</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./logo.png">

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --preto: #151515;
      --ouro: #c8a75f;
      --borda: #dcd8cf;
      --fundo: #f5f4f0;
      --texto: #242424;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font: 15px/1.5 system-ui, sans-serif;
    }
    header {
      background: var(--preto);
      color: white;
      border-bottom: 3px solid var(--ouro);
    }
    header > div, main {
      max-width: 1000px;
      margin: auto;
      padding: 18px;
    }
    header > div { display: flex; gap: 16px; align-items: center; }
    header img { width: 65px; height: 65px; object-fit: contain; }
    h1 { margin: 0; font-size: 1.5rem; }
    h2 { margin: 0 0 14px; font-size: 1.1rem; }
    p { margin: 6px 0 14px; }
    section {
      background: white;
      margin: 0 0 16px;
      padding: 18px;
      border: 1px solid var(--borda);
      border-radius: 12px;
    }
    label { display: grid; gap: 5px; font-weight: 600; }
    input, select, button { font: inherit; }
    input, select {
      width: 100%;
      min-width: 0;
      border: 1px solid #b9b5ac;
      border-radius: 6px;
      padding: 8px;
      background: white;
      color: var(--texto);
    }
    button {
      border: 1px solid var(--preto);
      border-radius: 7px;
      padding: 9px 15px;
      background: var(--preto);
      color: white;
      cursor: pointer;
    }
    button.secundario { color: var(--preto); background: white; }
    button:disabled, input:disabled, select:disabled { opacity: .55; cursor: default; }
    .grade { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .tabela { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borda); }
    td { vertical-align: top; }
    th { background: #f4f1e9; }
    td select { min-width: 142px; }
    .dinheiro { white-space: nowrap; text-align: right; }
    .aviso { color: #824a00; }
    #status {
      white-space: pre-line;
      overflow-wrap: anywhere;
      margin-bottom: 14px;
      border-left: 4px solid var(--ouro);
      padding: 10px 12px;
      background: #fffbef;
    }
    [hidden] { display: none !important; }
    @media(max-width: 640px) {
      .grade { grid-template-columns: 1fr; }
      main { padding: 10px; }
      section { padding: 14px; }
    }
  </style>
</head>

<body>
<header>
  <div>
    <img src="./logo.png" alt="M&IC">
    <h1>Apurador de Renda</h1>
  </div>
</header>

<main>
  <div id="status" role="status" aria-live="polite">Selecione os extratos para iniciar.</div>

  <section>
    <h2>1. Extratos bancários</h2>
    <label>
      Extratos em PDF ou imagem
      <input id="extratos" type="file" multiple accept="application/pdf,image/*">
    </label>
    <div class="acoes">
      <button id="validar" type="button">Validar titularidade</button>
    </div>
  </section>

  <section id="cadastro" hidden>
    <h2>2. Titular e familiares</h2>

    <label>
      Documento oficial ou certidão de casamento
      <input id="documento" type="file" accept="application/pdf,image/*">
    </label>
    <div class="acoes">
      <button id="lerDoc" type="button" class="secundario">Ler documento</button>
    </div>

    <br>

    <div class="grade">
      <label>Titular<input id="titular"></label>
      <label>CPF de referência<input id="cpf" readonly></label>
      <label>Pai<input id="pai"></label>
      <label>Mãe<input id="mae"></label>
      <label>Cônjuge<input id="conjuge"></label>
      <label>
        Finalidade
        <select id="finalidade">
          <option value="">Selecione</option>
          <option value="aluguel">Aluguel</option>
          <option value="financiamento">Financiamento</option>
        </select>
      </label>
      <label>Primeiro mês solicitado<input id="inicio" type="month"></label>
      <label>Último mês solicitado<input id="fim" type="month"></label>
    </div>

    <div class="acoes">
      <button id="processar" type="button">Apurar renda</button>
    </div>
  </section>

  <section id="revisao" hidden>
    <h2>3. Conferência das entradas</h2>
    <p id="cobertura"></p>
    <p id="pendencias" class="aviso"></p>
    <div class="tabela">
      <table>
        <thead>
          <tr>
            <th>Data e origem</th>
            <th>Descrição e motivo</th>
            <th class="dinheiro">Crédito</th>
            <th>Decisão</th>
          </tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
  </section>

  <section id="resumo" hidden>
    <h2>4. Resultado</h2>
    <div id="totais"></div>
    <div class="acoes">
      <button id="baixar" type="button">Baixar PDF</button>
      <button id="compartilhar" type="button" class="secundario">Compartilhar PDF</button>
    </div>
  </section>

  <button id="nova" type="button" class="secundario">Nova análise</button>
</main>

<script>
"use strict";

const el = id => document.getElementById(id);
const moeda = centavos => (centavos / 100).toLocaleString("pt-BR", {
  style: "currency", currency: "BRL"
});
const mesBR = mes => mes.slice(5, 7) + "/" + mes.slice(0, 4);
const dataBR = data => data.split("-").reverse().join("/");
const normal = valor => String(valor || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/\s+/g, " ").trim();

const camposPessoa = ["titular", "pai", "mae", "conjuge"];
const statusValidos = ["CONSIDERADO", "REJEITADO", "REVISAR"];
const identificacoes = new Map();
const leituras = new Map();

let senha = "";
let ocupado = false;
let titularValidado = false;
let relatorio = null;

function avisar(texto) {
  el("status").textContent = texto;
}

function atualizarControles() {
  for (const id of ["extratos", "documento", "titular", "pai", "mae", "conjuge",
                    "finalidade", "inicio", "fim", "nova"]) {
    el(id).disabled = ocupado;
  }
  el("validar").disabled = ocupado || !el("extratos").files.length;
  el("lerDoc").disabled = ocupado || !titularValidado || !el("documento").files.length;
  el("processar").disabled = ocupado || !titularValidado;
  const pendente = !relatorio || relatorio.linhas.some(t => t.status === "REVISAR");
  el("baixar").disabled = ocupado || pendente;
  el("compartilhar").disabled = ocupado || pendente;
}

async function executar(acao) {
  if (ocupado) return;
  ocupado = true;
  atualizarControles();
  try {
    await acao();
  } catch (erro) {
    avisar(erro.message || String(erro));
  } finally {
    ocupado = false;
    atualizarControles();
  }
}

function retirarResultado() {
  relatorio = null;
  el("linhas").replaceChildren();
  el("totais").replaceChildren();
  el("revisao").hidden = true;
  el("resumo").hidden = true;
  atualizarControles();
}

function limparSelecao() {
  titularValidado = false;
  identificacoes.clear();
  leituras.clear();
  retirarResultado();
  for (const id of [...camposPessoa, "cpf", "documento", "inicio", "fim", "finalidade"]) {
    el(id).value = "";
  }
  el("cadastro").hidden = true;
}

async function chamarAPI(operacao, partes, referencia = {}) {
  if (!senha) senha = prompt("Senha do apurador") || "";
  if (!senha) throw Error("Informe a senha para continuar.");

  const resposta = await fetch("/api/audit", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + senha
    },
    body: JSON.stringify({ operacao, ...partes, referencia })
  });

  if (resposta.status === 401) senha = "";
  const json = await resposta.json().catch(() => ({}));
  if (!resposta.ok) throw Error(json.error || "Falha HTTP " + resposta.status);
  return json;
}

async function abrirPDF(arquivo) {
  if (arquivo.type !== "application/pdf" && !/\.pdf$/i.test(arquivo.name)) return null;
  if (!window.pdfjsLib) throw Error("A biblioteca de leitura de PDF não carregou.");
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return pdfjsLib.getDocument({ data: await arquivo.arrayBuffer() }).promise;
}

function jpeg(canvas) {
  const imagem = canvas.toDataURL("image/jpeg", 0.76).split(",")[1];
  canvas.width = canvas.height = 1;
  if (!imagem || imagem.length > 2800000) {
    throw Error("Imagem acima do limite. Envie uma cópia menor e legível.");
  }
  return imagem;
}

async function lerFoto(arquivo) {
  const url = URL.createObjectURL(arquivo);
  try {
    const foto = new Image();
    await new Promise((ok, falha) => {
      foto.onload = ok;
      foto.onerror = () => falha(Error("Imagem ilegível ou formato incompatível."));
      foto.src = url;
    });
    const escala = Math.min(1, 1800 / Math.max(foto.width, foto.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(foto.width * escala));
    canvas.height = Math.max(1, Math.round(foto.height * escala));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(foto, 0, 0, canvas.width, canvas.height);
    return { imagem: jpeg(canvas) };
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function lerPagina(arquivo, pdf, numero, visual = false) {
  if (!pdf) return lerFoto(arquivo);
  const pagina = await pdf.getPage(numero);
  try {
    const conteudo = await pagina.getTextContent();
    const texto = conteudo.items
      .map(item => item.str + (item.hasEOL ? "\n" : " ")).join("");

    if (!visual && texto.length >= 100 && texto.length <= 65000 &&
        /\d+[.,]\d{2}\b/.test(texto)) {
      return { texto };
    }

    const base = pagina.getViewport({ scale: 1 });
    const viewport = pagina.getViewport({
      scale: 1800 / Math.max(base.width, base.height)
    });
    const canvas = document.createElement("canvas");
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    await pagina.render({
      canvasContext: canvas.getContext("2d"),
      viewport,
      background: "white"
    }).promise;
    return { imagem: jpeg(canvas), texto: texto.slice(0, 65000) };
  } finally {
    pagina.cleanup();
  }
}

function conferirPessoa(base, pessoa, origem) {
  if (!normal(pessoa?.titular)) throw Error("Titular ilegível em " + origem);
  if (!base) return;

  const cpf = s => String(s || "").replace(/[^\d*xX]/g, "");
  const a = cpf(base.cpf);
  const b = cpf(pessoa.cpf);
  let comuns = 0;
  if (a.length === 11 && b.length === 11) {
    for (let i = 0; i < 11; i++) {
      if (!/\d/.test(a[i]) || !/\d/.test(b[i])) continue;
      if (a[i] !== b[i]) throw Error("CPF divergente em " + origem);
      comuns++;
    }
  }

  if (comuns >= 6 && normal(base.titular) === normal(pessoa.titular)) return;

  const confirmado = confirm([
    "Confira a titularidade no original.",
    origem,
    "Referência: " + base.titular + " · " + (base.cpf || "CPF ausente"),
    "Arquivo: " + pessoa.titular + " · " + (pessoa.cpf || "CPF ausente"),
    "Você confirmou que os documentos pertencem à mesma pessoa?"
  ].join("\n"));

  if (!confirmado) throw Error("Titularidade pendente em " + origem);
}

async function validarTitularidade() {
  const arquivos = Array.from(el("extratos").files);
  if (!arquivos.length) throw Error("Selecione pelo menos um extrato.");
  let base = null;

  for (const [indice, arquivo] of arquivos.entries()) {
    avisar(`Titularidade ${indice + 1}/${arquivos.length} · ${arquivo.name}`);
    let pessoa = identificacoes.get(indice);
    if (!pessoa) {
      const pdf = await abrirPDF(arquivo);
      try {
        pessoa = await chamarAPI("titular", await lerPagina(arquivo, pdf, 1, true));
        conferirPessoa(base, pessoa, arquivo.name);
        identificacoes.set(indice, pessoa);
      } finally {
        await pdf?.destroy();
      }
    }
    if (!base) base = pessoa;
  }

  if (!titularValidado) {
    el("titular").value = base.titular;
    el("cpf").value = base.cpf || "";
  }
  titularValidado = true;
  el("cadastro").hidden = false;
  avisar("Titularidade conferida. Informe o período solicitado e confira os dados familiares.");
}

async function lerDocumento() {
  const arquivo = el("documento").files[0];
  if (!arquivo) throw Error("Selecione o documento oficial.");
  const referencia = {
    titular: el("titular").value.trim(),
    cpf: el("cpf").value.trim()
  };
  const acumulado = {};
  const pdf = await abrirPDF(arquivo);

  try {
    for (let n = 1; n <= (pdf?.numPages || 1); n++) {
      avisar("Lendo documento oficial · página " + n);
      const parte = await chamarAPI(
        "documento", await lerPagina(arquivo, pdf, n, true), referencia
      );
      for (const campo of [...camposPessoa, "cpf"]) {
        const valor = String(parte[campo] || "").trim();
        if (!valor) continue;
        if (acumulado[campo] && normal(acumulado[campo]) !== normal(valor)) {
          throw Error("O documento apresentou valores divergentes para " + campo +
            ". Confira o original e preencha os campos manualmente.");
        }
        acumulado[campo] = valor;
      }
    }
  } finally {
    await pdf?.destroy();
  }

  conferirPessoa(referencia, acumulado, arquivo.name);
  retirarResultado();
  for (const campo of camposPessoa) el(campo).value = acumulado[campo] || "";
  avisar("Documento lido. Confira principalmente a filiação e o cônjuge.");
}

function periodoSolicitado() {
  const inicio = el("inicio").value;
  const fim = el("fim").value;
  if (!inicio || !fim || inicio > fim) throw Error("Confira o primeiro e o último mês.");

  const meses = [];
  let [ano, mes] = inicio.split("-").map(Number);
  const [anoFim, mesFim] = fim.split("-").map(Number);
  while (ano < anoFim || (ano === anoFim && mes <= mesFim)) {
    meses.push(String(ano).padStart(4, "0") + "-" + String(mes).padStart(2, "0"));
    if (++mes === 13) { mes = 1; ano++; }
  }
  return meses;
}

function validarPagina(pagina) {
  if (pagina?.completa !== true) throw Error(pagina?.observacao || "Leitura incompleta.");
  if (!Array.isArray(pagina.meses) ||
      pagina.meses.some(m => typeof m !== "string" || !/^\d{4}-(0[1-9]|1[0-2])$/.test(m))) {
    throw Error("Cobertura mensal inválida.");
  }
  if (!Array.isArray(pagina.transacoes)) throw Error("Lista de créditos ausente.");

  for (const t of pagina.transacoes) {
    const data = new Date(t.data + "T12:00:00Z");
    if (!Number.isFinite(+data) || data.toISOString().slice(0, 10) !== t.data ||
        !Number.isSafeInteger(t.centavos) || t.centavos <= 0 ||
        typeof t.descricao !== "string" || !t.descricao.trim() ||
        !statusValidos.includes(t.status)) {
      throw Error("Há lançamento com data, valor, descrição ou classificação inválida.");
    }
  }
}

async function analisarPagina(arquivo, pdf, numero, referencia) {
  const partes = await lerPagina(arquivo, pdf, numero);
  let resposta = await chamarAPI("pagina", partes, referencia);
  try {
    validarPagina(resposta);
  } catch (erro) {
    if (!pdf || partes.imagem) throw erro;
    resposta = await chamarAPI("pagina",
      await lerPagina(arquivo, pdf, numero, true), referencia);
    validarPagina(resposta);
  }
  return resposta;
}

async function apurar() {
  if (!titularValidado) throw Error("Valide a titularidade.");
  if (!el("finalidade").value) throw Error("Selecione aluguel ou financiamento.");
  const meses = periodoSolicitado();
  const referencia = { cpf: el("cpf").value.trim() };
  for (const campo of camposPessoa) referencia[campo] = el(campo).value.trim();
  if (!referencia.titular) throw Error("Informe o titular.");

  const arquivos = Array.from(el("extratos").files);
  const paginas = [];
  retirarResultado();

  for (const [indice, arquivo] of arquivos.entries()) {
    const pdf = await abrirPDF(arquivo);
    try {
      const quantidade = pdf?.numPages || 1;
      for (let numero = 1; numero <= quantidade; numero++) {
        const origem = `${arquivo.name} · pág. ${numero}`;
        const chave = JSON.stringify([indice, numero, referencia]);
        avisar(`Arquivo ${indice + 1}/${arquivos.length} · página ${numero}/${quantidade}\n${arquivo.name}`);
        if (!leituras.has(chave)) {
          try {
            const dados = await analisarPagina(arquivo, pdf, numero, referencia);
            leituras.set(chave, { ...dados, origem });
          } catch (erro) {
            throw Error(`${origem} · ${erro.message}\n` +
              "Mantenha a aba aberta e clique em Apurar renda para retomar.");
          }
        }
        paginas.push(leituras.get(chave));
      }
    } finally {
      await pdf?.destroy();
    }
  }

  const cobertos = new Set();
  const linhas = [];
  const datasValores = new Map();
  const idsBancarios = new Map();
  const selecionados = new Set(meses);
  let fora = 0;

  function registrar(grupo, chave, linha) {
    if (!grupo.has(chave)) grupo.set(chave, []);
    grupo.get(chave).push(linha);
  }

  for (const pagina of paginas) {
    for (const mes of pagina.meses) cobertos.add(mes);
    for (const t of pagina.transacoes) {
      const mes = t.data.slice(0, 7);
      cobertos.add(mes);
      if (!selecionados.has(mes)) { fora++; continue; }
      const linha = {
        ...t,
        origem: pagina.origem,
        motivo: String(t.motivo || ""),
        sugestao: t.status,
        coincidencia: false
      };
      linhas.push(linha);
      registrar(datasValores, `${t.data}|${t.centavos}`, linha);
      const id = String(t.id_bancario || "").trim();
      if (id) registrar(idsBancarios, id, linha);
    }
  }

  const faltantes = meses.filter(m => !cobertos.has(m));
  if (faltantes.length) {
    throw Error("Falta cobertura documental para " + faltantes.map(mesBR).join(", ") +
      ". Confira o período solicitado e os arquivos anexados.");
  }

  for (const grupo of [datasValores, idsBancarios]) {
    for (const iguais of grupo.values()) {
      if (iguais.length < 2) continue;
      for (const linha of iguais) {
        linha.coincidencia = true;
        linha.status = "REVISAR";
      }
    }
  }

  linhas.sort((a, b) => a.data.localeCompare(b.data) || a.centavos - b.centavos);
  relatorio = {
    meses, linhas, referencia, finalidade: el("finalidade").value, fora
  };
  mostrarRevisao();
  avisar("Leitura concluída. Confira as entradas e resolva os itens marcados para revisão.");
}

function celula(tr, texto) {
  const td = document.createElement("td");
  td.textContent = texto;
  tr.append(td);
  return td;
}

function mostrarRevisao() {
  const corpo = el("linhas");
  corpo.replaceChildren();
  const fragmento = document.createDocumentFragment();

  for (const t of relatorio.linhas) {
    const tr = document.createElement("tr");
    celula(tr, `${dataBR(t.data)} · ${t.origem}`);
    const detalhe = [
      t.descricao,
      t.motivo,
      t.coincidencia ? "Possível repetição. Confira a origem das duas linhas." : "",
      t.id_bancario ? "ID: " + t.id_bancario : ""
    ].filter(Boolean).join(" · ");
    celula(tr, detalhe);
    celula(tr, moeda(t.centavos)).className = "dinheiro";

    const select = document.createElement("select");
    select.setAttribute("aria-label", "Decisão sobre " + t.descricao);
    for (const status of statusValidos) select.add(new Option(status, status));
    select.value = t.status;
    select.addEventListener("change", () => {
      t.status = select.value;
      t.manual = true;
      atualizarResumo();
    });
    celula(tr, "").append(select);
    fragmento.append(tr);
  }
  corpo.append(fragmento);

  const meses = relatorio.meses;
  el("cobertura").textContent =
    `${meses.length} mês(es) · ${mesBR(meses[0])} a ${mesBR(meses[meses.length - 1])}` +
    ` · ${relatorio.linhas.length} crédito(s) no período` +
    (relatorio.fora ? ` · ${relatorio.fora} crédito(s) fora do período solicitado` : "");
  el("revisao").hidden = false;
  el("resumo").hidden = false;
  atualizarResumo();
}

function calcular() {
  const mensal = new Map(relatorio.meses.map(m => [m, 0]));
  let aceitos = 0, rejeitados = 0, pendentes = 0;
  for (const t of relatorio.linhas) {
    if (t.status === "REVISAR") { pendentes++; continue; }
    if (t.status === "REJEITADO") { rejeitados += t.centavos; continue; }
    aceitos += t.centavos;
    const m = t.data.slice(0, 7);
    mensal.set(m, mensal.get(m) + t.centavos);
  }
  return {
    mensal, aceitos, rejeitados, pendentes,
    media: Math.round(aceitos / relatorio.meses.length)
  };
}

function atualizarResumo() {
  const r = calcular();
  el("pendencias").textContent = r.pendentes
    ? `${r.pendentes} lançamento(s) aguardando decisão. Valores abaixo são parciais.`
    : "Conferência sem itens pendentes.";
  el("totais").textContent =
    `Considerado: ${moeda(r.aceitos)} · Rejeitado: ${moeda(r.rejeitados)} · ` +
    `Média mensal: ${moeda(r.media)}`;
  atualizarControles();
}

function gerarPDF() {
  if (!relatorio) throw Error("Faça a apuração primeiro.");
  const r = calcular();
  if (r.pendentes) throw Error("Conclua a conferência das entradas.");
  if (!window.jspdf?.jsPDF) throw Error("A biblioteca de PDF não carregou.");
  const doc = new window.jspdf.jsPDF();
  if (typeof doc.autoTable !== "function") throw Error("A biblioteca de tabelas não carregou.");

  const pessoa = relatorio.referencia;
  const financiamento = relatorio.finalidade === "financiamento";
  const opcoes = {
    margin: { left: 14, right: 14, top: 30, bottom: 16 },
    headStyles: { fillColor: [34, 32, 29], textColor: [246, 223, 170] },
    styles: { font: "helvetica", fontSize: 8, cellPadding: 2.2, overflow: "linebreak" },
    showHead: "everyPage"
  };

  doc.autoTable({
    ...opcoes, startY: 30,
    head: [["Identificação", financiamento ? "Financiamento" : "Aluguel"]],
    body: [
      ["Titular", pessoa.titular],
      ["Pai", pessoa.pai || "Não informado"],
      ["Mãe", pessoa.mae || "Não informada"],
      ["Cônjuge", pessoa.conjuge || "Não informado"]
    ]
  });

  doc.autoTable({
    ...opcoes, startY: doc.lastAutoTable.finalY + 6,
    head: [["Mês", "Entradas consideradas"]],
    body: [...r.mensal].map(([m, valor]) => [mesBR(m), moeda(valor)]),
    foot: [
      ["Total considerado", moeda(r.aceitos)],
      ["Total rejeitado", moeda(r.rejeitados)],
      ["Média mensal", moeda(r.media)]
    ],
    showFoot: "lastPage",
    footStyles: { fillColor: [244, 239, 227], textColor: [35, 35, 35] },
    columnStyles: { 1: { halign: "right" } }
  });

  if (financiamento && relatorio.linhas.length) {
    doc.addPage();
    doc.autoTable({
      ...opcoes, startY: 30,
      head: [["Data", "Lançamento e origem", "Valor", "Decisão e motivo"]],
      body: relatorio.linhas.map(t => [
        dataBR(t.data),
        `${t.descricao}\n${t.origem}`,
        moeda(t.centavos),
        [
          t.status,
          t.manual ? "Conferência manual" : "",
          t.motivo ? (t.manual ? "Motivo original: " : "") + t.motivo : ""
        ].filter(Boolean).join("\n")
      ]),
      columnStyles: {
        0: { cellWidth: 20 }, 2: { cellWidth: 25, halign: "right" },
        3: { cellWidth: 48 }
      }
    });
  }

  const total = doc.getNumberOfPages();
  for (let i = 1; i <= total; i++) {
    doc.setPage(i);
    doc.setFillColor(22, 22, 22);
    doc.rect(0, 0, 210, 22, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.setTextColor(225, 198, 139);
    doc.text("M&IC | Apuração de renda", 14, 14);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(90, 90, 90);
    doc.text(`Página ${i} de ${total}`, 196, 290, { align: "right" });
  }

  const nome = pessoa.titular.replace(/[^\p{L}\p{N} -]/gu, "").trim() || "Titular";
  return { doc, nome: `Apuracao de renda - ${nome}.pdf` };
}

el("extratos").addEventListener("change", () => {
  limparSelecao();
  const n = el("extratos").files.length;
  avisar(n ? `${n} arquivo(s) selecionado(s). Clique em Validar titularidade.`
           : "Selecione os extratos para iniciar.");
  atualizarControles();
});

el("documento").addEventListener("change", atualizarControles);

for (const id of [...camposPessoa, "inicio", "fim", "finalidade"]) {
  el(id).addEventListener("input", () => {
    if (relatorio) {
      retirarResultado();
      avisar("Cadastro ou período alterado. Clique em Apurar renda para atualizar.");
    }
  });
}

el("validar").onclick = () => executar(validarTitularidade);
el("lerDoc").onclick = () => executar(lerDocumento);
el("processar").onclick = () => executar(apurar);

el("baixar").onclick = () => executar(async () => {
  const { doc, nome } = gerarPDF();
  doc.save(nome);
  avisar("PDF gerado.");
});

el("compartilhar").onclick = () => executar(async () => {
  const { doc, nome } = gerarPDF();
  const arquivo = new File([doc.output("blob")], nome, { type: "application/pdf" });
  if (navigator.canShare?.({ files: [arquivo] })) {
    try {
      await navigator.share({ files: [arquivo], title: "Apuração de renda M&IC" });
    } catch (erro) {
      if (erro.name === "AbortError") { avisar("Compartilhamento cancelado."); return; }
      throw erro;
    }
  } else {
    doc.save(nome);
    avisar("PDF baixado. Você pode anexá-lo no WhatsApp.");
  }
});

el("nova").onclick = () => {
  if (el("extratos").files.length && !confirm("Encerrar esta análise e limpar o progresso?")) return;
  el("extratos").value = "";
  limparSelecao();
  senha = "";
  avisar("Selecione os extratos para iniciar.");
  atualizarControles();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

atualizarControles();
</script>
</body>
</html>
