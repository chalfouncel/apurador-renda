<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151515">
  <title>Apurador de Renda | M&amp;IC</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./logo.png">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f4f0; color: #242424; font: 15px/1.5 system-ui, sans-serif; }
    header { background: #151515; color: white; border-bottom: 3px solid #c8a75f; }
    header div, main { max-width: 1000px; margin: auto; padding: 18px; }
    header div { display: flex; align-items: center; gap: 16px; }
    header img { width: 64px; height: 64px; object-fit: contain; }
    h1, h2, p { margin-top: 0; }
    h1 { font-size: 1.5rem; margin-bottom: 0; }
    h2 { font-size: 1.15rem; }
    section { background: white; border: 1px solid #dcd8cf; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    label { display: grid; gap: 5px; font-weight: 600; }
    button, input, select { font: inherit; }
    input, select { min-width: 0; width: 100%; padding: 8px; border: 1px solid #aaa69d; border-radius: 6px; background: white; color: inherit; }
    input[type=checkbox] { width: auto; }
    button { border: 1px solid #151515; border-radius: 7px; padding: 9px 15px; background: #151515; color: white; cursor: pointer; }
    button.secundario { color: #151515; background: white; }
    :disabled { opacity: .55; cursor: default; }
    [hidden] { display: none !important; }
    .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .acoes { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
    .grupo { border-top: 1px solid #dcd8cf; padding: 10px 0; overflow-wrap: anywhere; }
    .grupo label { display: flex; align-items: flex-start; gap: 8px; }
    .grupo ul { margin: 6px 0; }
    .aviso { color: #824a00; }
    .tabela { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid #dcd8cf; }
    th { background: #f4f1e9; }
    td select { min-width: 140px; }
    .valor { white-space: nowrap; text-align: right; }
    #status { white-space: pre-line; overflow-wrap: anywhere; padding: 10px 12px; margin-bottom: 14px; background: #fffbef; border-left: 4px solid #c8a75f; }
    @media (max-width: 640px) { .grade { grid-template-columns: 1fr; } main { padding: 10px; } }
  </style>
</head>
<body>
<header><div><img src="./logo.png" alt="M&amp;IC"><h1>Apurador de Renda</h1></div></header>

<main>
  <div id="status" role="status" aria-live="polite">Anexe o documento oficial.</div>

  <section>
    <h2>Documento oficial</h2>
    <label>
      RG ou CNH
      <input id="documento" type="file" multiple accept="application/pdf,image/*">
    </label>
    <div class="acoes"><button id="lerDocumento" type="button">Ler documento</button></div>
    <div class="grade">
      <label>Nome completo<input id="titular" autocomplete="off"></label>
      <label>CPF<input id="cpf" inputmode="numeric" autocomplete="off"></label>
      <label>Pai<input id="pai" autocomplete="off"></label>
      <label>Mãe<input id="mae" autocomplete="off"></label>
      <label>Cônjuge<input id="conjuge" autocomplete="off"></label>
    </div>
    <div class="acoes"><button id="confirmarDocumento" type="button">Confirmar dados do documento</button></div>
  </section>

  <section id="secaoExtratos" hidden>
    <h2>Extratos bancários</h2>
    <p id="referencia"></p>
    <label>
      Extratos em PDF ou imagem
      <input id="extratos" type="file" multiple accept="application/pdf,image/*">
    </label>
    <div class="acoes"><button id="conferir" type="button">Conferir titularidade</button></div>
    <div id="conferencia" hidden>
      <div id="grupos"></div>
      <button id="confirmarPendencias" type="button" hidden>Confirmar grupos pendentes</button>
    </div>
  </section>

  <section id="secaoApuracao" hidden>
    <h2>Apuração</h2>
    <label>
      Finalidade
      <select id="finalidade">
        <option value="">Selecione</option>
        <option value="aluguel">Aluguel</option>
        <option value="financiamento">Financiamento</option>
      </select>
    </label>
    <div class="acoes"><button id="apurar" type="button">Ler extratos e apurar renda</button></div>
    <label>
      Certidão de casamento, se precisar complementar os dados
      <input id="certidao" type="file" accept="application/pdf,image/*">
    </label>
    <div class="acoes"><button id="lerCertidao" type="button" class="secundario">Ler certidão</button></div>
  </section>

  <section id="revisao" hidden>
    <h2>Período encontrado e resultado</h2>
    <p id="cobertura"></p>
    <ul id="coberturaArquivos"></ul>
    <p id="lacunas" class="aviso" hidden></p>
    <p id="totais"></p>
    <p id="pendencias" class="aviso"></p>
    <div class="tabela">
      <table>
        <thead><tr><th>Data e origem</th><th>Descrição e motivo</th><th class="valor">Crédito</th><th>Decisão</th></tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
    <div class="acoes">
      <button id="baixar" type="button">Baixar PDF</button>
      <button id="compartilhar" type="button" class="secundario">Compartilhar PDF</button>
    </div>
  </section>

  <button id="nova" type="button" class="secundario">Nova análise</button>
</main>

<script>
"use strict";

const el = id => document.getElementById(id);
const familiares = ["pai", "mae", "conjuge"];
const decisoes = ["CONSIDERADO", "REJEITADO", "REVISAR"];
const mesValido = /^\d{4}-(0[1-9]|1[0-2])$/;
const identificacoes = new Map();
const leituras = new Map();
const pdfWorker = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let senha = "";
let ocupado = false;
let pessoa = null;
let liberado = false;
let grupos = [];
let relatorio = null;

const normal = valor => String(valor || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z]+/g, " ").trim();
const mesBR = m => `${m.slice(5)}/${m.slice(0, 4)}`;
const dataBR = d => d.split("-").reverse().join("/");
const moeda = c => (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const avisar = texto => { el("status").textContent = texto; };

function limparCPF(valor) {
  const cpf = String(valor || "").replace(/[^\d*xX]/g, "").replace(/[xX]/g, "*");
  return cpf.length === 11 ? cpf : "";
}

function cpfsDivergem(a, b) {
  const esquerda = limparCPF(a);
  const direita = limparCPF(b);
  return Boolean(esquerda && direita && [...esquerda].some((digito, i) =>
    digito !== "*" && direita[i] !== "*" && digito !== direita[i]));
}

function cpfValido(cpf) {
  if (!/^\d{11}$/.test(cpf) || /^(\d)\1{10}$/.test(cpf)) return false;
  return [9, 10].every(tamanho => {
    const soma = [...cpf.slice(0, tamanho)]
      .reduce((valor, digito, i) => valor + Number(digito) * (tamanho + 1 - i), 0);
    return ((soma * 10) % 11) % 10 === Number(cpf[tamanho]);
  });
}

function controles() {
  for (const campo of document.querySelectorAll("input, select, button")) campo.disabled = ocupado;
  el("lerDocumento").disabled = ocupado || !el("documento").files.length;
  el("confirmarDocumento").disabled = ocupado || !el("documento").files.length;
  el("conferir").disabled = ocupado || !pessoa || !el("extratos").files.length;
  el("lerCertidao").disabled = ocupado || !liberado || !el("certidao").files.length;
  el("apurar").disabled = ocupado || !liberado;
  const podeEmitir = relatorio && relatorio.linhas.every(linha => linha.status !== "REVISAR");
  el("baixar").disabled = ocupado || !podeEmitir;
  el("compartilhar").disabled = ocupado || !podeEmitir;
}

async function executar(acao) {
  if (ocupado) return;
  ocupado = true;
  controles();
  try {
    await acao();
  } catch (erro) {
    avisar(erro.message || String(erro));
  } finally {
    ocupado = false;
    controles();
  }
}

function invalidarResultado() {
  relatorio = null;
  el("revisao").hidden = true;
  el("linhas").replaceChildren();
}

function invalidarExtratos() {
  liberado = false;
  grupos = [];
  identificacoes.clear();
  leituras.clear();
  el("conferencia").hidden = true;
  el("secaoApuracao").hidden = true;
  el("grupos").replaceChildren();
  invalidarResultado();
}

function invalidarPessoa() {
  pessoa = null;
  el("secaoExtratos").hidden = true;
  invalidarExtratos();
}

async function api(operacao, partes, referencia = {}) {
  if (!senha) senha = prompt("Senha do apurador") || "";
  if (!senha) throw Error("Informe a senha para continuar.");

  const resposta = await fetch("/api/audit", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${senha}` },
    body: JSON.stringify({ operacao, ...partes, referencia })
  });
  if (resposta.status === 401) senha = "";
  const dados = await resposta.json().catch(() => ({}));

  if (!resposta.ok) {
    const erro = Error(dados.error || `Falha HTTP ${resposta.status}.`);
    erro.http = resposta.status;
    throw erro;
  }
  return dados;
}

function erroDeAcesso(erro) {
  return erro.http === 401 || erro.message === "Informe a senha para continuar.";
}

async function abrirPDF(arquivo) {
  if (arquivo.type !== "application/pdf" && !/\.pdf$/i.test(arquivo.name)) return null;
  if (!window.pdfjsLib) throw Error("A biblioteca de PDF não carregou.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = pdfWorker;
  return pdfjsLib.getDocument({
    data: await arquivo.arrayBuffer(),
    isEvalSupported: false
  }).promise;
}

function converterJPEG(canvas) {
  const imagem = canvas.toDataURL("image/jpeg", 0.78).split(",")[1];
  canvas.width = canvas.height = 1;
  if (!imagem || imagem.length > 2800000) throw Error("Imagem ilegível ou acima do limite.");
  return imagem;
}

async function carregarFoto(arquivo) {
  const url = URL.createObjectURL(arquivo);
  try {
    const foto = new Image();
    foto.src = url;
    await foto.decode();
    const escala = Math.min(1, 1800 / Math.max(foto.naturalWidth, foto.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(foto.naturalWidth * escala));
    canvas.height = Math.max(1, Math.round(foto.naturalHeight * escala));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(foto, 0, 0, canvas.width, canvas.height);
    return { imagem: converterJPEG(canvas) };
  } finally {
    URL.revokeObjectURL(url);
  }
}

function extrairTexto(conteudo) {
  let texto = "";
  let anterior;
  for (const item of conteudo.items) {
    if (typeof item.str !== "string") continue;
    const quebra = anterior && (anterior.hasEOL ||
      Math.abs(anterior.transform[5] - item.transform[5]) > 2);
    texto += (quebra ? "\n" : " ") + item.str;
    anterior = item;
  }
  return texto.trim();
}

async function lerPagina(arquivo, pdf, numero, modo = "texto") {
  if (!pdf) return carregarFoto(arquivo);
  const pagina = await pdf.getPage(numero);

  try {
    const texto = extrairTexto(await pagina.getTextContent());
    if (modo === "texto") return { texto };

    const base = pagina.getViewport({ scale: 1 });
    const viewport = pagina.getViewport({ scale: 1800 / Math.max(base.width, base.height) });
    const canvas = document.createElement("canvas");
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    await pagina.render({
      canvasContext: canvas.getContext("2d"), viewport, background: "white"
    }).promise;

    return { texto: texto.slice(0, 65000), imagem: converterJPEG(canvas) };
  } finally {
    pagina.cleanup();
  }
}

function mesclarDocumento(destino, parte) {
  for (const campo of ["titular", "cpf", ...familiares]) {
    const valor = String(parte[campo] || "").trim();
    if (!valor) continue;
    const anterior = destino[campo];

    if (campo === "cpf") {
      const novo = limparCPF(valor);
      if (!novo) continue;
      if (cpfsDivergem(anterior, novo)) throw Error("Foram encontrados CPFs divergentes no documento.");
      if (!anterior || novo.replace(/\*/g, "").length > anterior.replace(/\*/g, "").length) {
        destino.cpf = novo;
      }
    } else {
      if (anterior && normal(anterior) !== normal(valor)) {
        throw Error(`Dados divergentes no campo ${campo}. Confira o documento.`);
      }
      destino[campo] = valor;
    }
  }
}

async function lerIdentificacao(arquivos, referencia) {
  const dados = {};
  const falhas = [];

  for (const arquivo of arquivos) {
    const pdf = await abrirPDF(arquivo);
    try {
      for (let n = 1; n <= (pdf?.numPages || 1); n++) {
        avisar(`Lendo ${arquivo.name} · página ${n}`);
        let parte;
        try {
          parte = await api("documento", await lerPagina(arquivo, pdf, n, "visual"), referencia);
        } catch (erro) {
          if (erroDeAcesso(erro)) throw erro;
          falhas.push(`${arquivo.name}, pág. ${n}: ${erro.message}`);
          continue;
        }
        mesclarDocumento(dados, parte);
      }
    } finally {
      await pdf?.destroy();
    }
  }
  return { dados, falhas };
}

async function lerDocumento() {
  invalidarPessoa();
  const { dados, falhas } = await lerIdentificacao(Array.from(el("documento").files), {});

  for (const campo of ["titular", "cpf", ...familiares]) {
    if (dados[campo]) el(campo).value = dados[campo];
  }
  avisar(falhas.length
    ? `Confira os dados extraídos no original.\n${falhas.join("\n")}`
    : "Documento lido. Confira os dados e confirme.");
}

function confirmarDocumento() {
  const titular = el("titular").value.trim().replace(/\s+/g, " ");
  const cpf = limparCPF(el("cpf").value);
  if (!el("documento").files.length) throw Error("Anexe o documento oficial.");
  if (!normal(titular).includes(" ")) throw Error("Confira o nome completo no documento.");
  if (!cpfValido(cpf)) throw Error("Confira o CPF no documento oficial.");

  pessoa = { titular, cpf };
  el("referencia").textContent = `Pessoa analisada · ${titular}`;
  el("secaoExtratos").hidden = false;
  avisar("Documento confirmado. Anexe os extratos para conferir a titularidade.");
}

async function lerCertidao() {
  const { dados, falhas } = await lerIdentificacao([el("certidao").files[0]], pessoa);
  if (normal(dados.titular) !== normal(pessoa.titular) ||
      cpfsDivergem(pessoa.cpf, dados.cpf)) {
    throw Error(falhas[0] || "A identificação da certidão diverge do documento confirmado.");
  }

  for (const campo of familiares) if (dados[campo]) el(campo).value = dados[campo];
  invalidarResultado();
  avisar(falhas.length
    ? `Confira os dados extraídos da certidão.\n${falhas.join("\n")}`
    : "Certidão lida. Os campos encontrados foram preenchidos.");
}

function saudacaoSantander(texto) {
  if (!/\bsantander\b/i.test(texto) ||
      !/\bextrato\s+consolidado\s+inteligente\b/i.test(texto)) return "";

  const nome = texto.match(
    /\bprezad[ao]\s+([\p{L}]+(?:[ '-][\p{L}]+){0,7})\s*,/iu
  )?.[1] || "";
  return /^(cliente|correntista|titular|senhor|senhora|senhor cliente|senhora cliente)$/i
    .test(nome) ? "" : nome;
}

function contaSantander(texto) {
  const cabecalho = texto.split(
    /(?:^|\n)\s*(?:movimenta[cç][aã]o|data\s+canal|dep[oó]sitos\s*\/\s*transfer[eê]ncias)\b/i
  )[0];
  const linhas = cabecalho.split("\n").map(linha => linha.trim());
  const contas = new Set();

  for (const [i, linha] of linhas.entries()) {
    const juntas = linha.match(/^(\d{4})[ \t]+(\d{2}\.\d{6}-\d)$/);
    if (juntas) contas.add(`${juntas[1]}|${juntas[2]}`);
    if (/^\d{4}$/.test(linha) && /^\d{2}\.\d{6}-\d$/.test(linhas[i + 1] || "")) {
      contas.add(`${linha}|${linhas[i + 1]}`);
    }
  }
  return contas.size === 1 ? [...contas][0] : "";
}

function cpfIdentificadoNoTexto(texto) {
  const achados = [...texto.matchAll(/\bCPF\s*[:\-]?\s*([\d*xX]{3}\.?[\d*xX]{3}\.?[\d*xX]{3}-?[\d*xX]{2})\b/gi)]
    .map(m => limparCPF(m[1])).filter(Boolean);
  return [...new Set(achados)];
}

async function identificarExtrato(arquivo) {
  const pdf = await abrirPDF(arquivo);
  try {
    const capa = pdf ? (await lerPagina(arquivo, pdf, 1)).texto : "";
    const saudacao = saudacaoSantander(capa);

    if (saudacao) {
      const segunda = pdf.numPages > 1 ? (await lerPagina(arquivo, pdf, 2)).texto : "";
      return { arquivo, nome: saudacao, cpfs: cpfIdentificadoNoTexto(capa),
        conta: contaSantander(capa + "\n" + segunda), origem: "saudação do banco" };
    }

    const dados = await api("titular", await lerPagina(arquivo, pdf, 1, "visual"), pessoa);
    return { arquivo, nome: String(dados.titular || "").trim(),
      cpfs: [limparCPF(dados.cpf)].filter(Boolean), conta: "", origem: "identificação do extrato" };
  } finally {
    await pdf?.destroy();
  }
}

function liberarApuracao() {
  liberado = true;
  el("confirmarPendencias").hidden = true;
  el("secaoApuracao").hidden = false;
  avisar("Titularidade conferida. Escolha a finalidade e clique em Ler extratos e apurar renda.");
}

function mostrarGrupos() {
  const painel = el("grupos");
  painel.replaceChildren();
  const nomeOficial = normal(pessoa.titular);

  for (const grupo of grupos) {
    const bloco = document.createElement("div");
    bloco.className = "grupo";
    const titulo = document.createElement("strong");
    const [agencia, conta] = grupo.conta.split("|");
    titulo.textContent = grupo.conta
      ? `Santander · agência ${agencia} · conta ${conta}`
      : grupo.registros[0].arquivo.name;
    bloco.append(titulo);

    const lista = document.createElement("ul");
    for (const registro of grupo.registros) {
      const item = document.createElement("li");
      item.textContent = `${registro.arquivo.name} · ${registro.nome
        ? `${registro.origem}: ${registro.nome}` : "identificação pendente"}` +
        (registro.falha ? ` · ${registro.falha}` : "");
      lista.append(item);
    }
    bloco.append(lista);

    grupo.bloqueado = grupo.registros.some(r => r.cpfs.some(cpf => cpfsDivergem(pessoa.cpf, cpf)));
    grupo.automatico = !grupo.bloqueado &&
      grupo.registros.every(r => normal(r.nome) === nomeOficial);

    if (grupo.bloqueado || grupo.automatico) {
      const nota = document.createElement("p");
      nota.textContent = grupo.bloqueado
        ? "CPF divergente. Retire ou substitua o extrato para continuar."
        : "Nome completo conferido com o documento.";
      if (grupo.bloqueado) nota.className = "aviso";
      bloco.append(nota);
    } else {
      const label = document.createElement("label");
      const caixa = document.createElement("input");
      caixa.type = "checkbox";
      const frase = document.createElement("span");
      frase.textContent = grupo.conta
        ? "Conferi que esta conta e os extratos listados pertencem à pessoa analisada."
        : "Conferi no original que este extrato pertence à pessoa analisada.";

      if (grupo.registros.some(r => {
        const nome = normal(r.nome);
        return nome && nome !== nomeOficial && nome !== nomeOficial.split(" ")[0];
      })) {
        frase.className = "aviso";
        frase.textContent = "O nome encontrado difere do documento. " + frase.textContent;
      }

      label.append(caixa, frase);
      bloco.append(label);
      grupo.caixa = caixa;
    }
    painel.append(bloco);
  }

  el("conferencia").hidden = false;
  const bloqueado = grupos.some(g => g.bloqueado);
  const pendente = grupos.some(g => g.caixa);
  el("confirmarPendencias").hidden = bloqueado || !pendente;

  if (bloqueado) avisar("Há CPF divergente entre os extratos e o documento.");
  else if (pendente) avisar("Confira apenas os grupos que ficaram pendentes.");
  else liberarApuracao();
}

async function conferirExtratos() {
  liberado = false;
  el("secaoApuracao").hidden = true;
  el("conferencia").hidden = true;
  invalidarResultado();
  const arquivos = Array.from(el("extratos").files);
  const porConta = new Map();

  for (const [indice, arquivo] of arquivos.entries()) {
    avisar(`Conferindo extrato ${indice + 1}/${arquivos.length} · ${arquivo.name}`);
    let registro = identificacoes.get(indice);

    if (!registro) {
      try {
        registro = await identificarExtrato(arquivo);
        identificacoes.set(indice, registro);
      } catch (erro) {
        if (erroDeAcesso(erro)) throw erro;
        registro = { arquivo, nome: "", cpfs: [], conta: "", falha: erro.message };
      }
    }

    const chave = registro.conta ? `santander|${registro.conta}` : `arquivo|${indice}`;
    if (!porConta.has(chave)) porConta.set(chave, { conta: registro.conta, registros: [] });
    porConta.get(chave).registros.push(registro);
  }

  grupos = [...porConta.values()];
  mostrarGrupos();
}

function confirmarPendencias() {
  if (!grupos.length || grupos.some(g => g.bloqueado)) throw Error("Resolva os extratos divergentes.");
  if (grupos.some(g => g.caixa && !g.caixa.checked)) throw Error("Confira os grupos pendentes.");
  liberarApuracao();
}

function validarPagina(dados) {
  if (dados?.completa !== true) throw Error(dados?.observacao || "Página incompleta.");
  if (!Array.isArray(dados.meses) || dados.meses.some(m => typeof m !== "string" ||
      !mesValido.test(m)) || !Array.isArray(dados.transacoes)) {
    throw Error("A leitura devolveu um período ou uma lista de créditos inválida.");
  }

  for (const t of dados.transacoes) {
    const data = new Date(t?.data + "T12:00:00Z");
    if (!Number.isFinite(+data) || data.toISOString().slice(0, 10) !== t.data ||
        !Number.isSafeInteger(t.centavos) || t.centavos <= 0 ||
        typeof t.descricao !== "string" || !t.descricao.trim() ||
        !decisoes.includes(t.status)) {
      throw Error("A página contém lançamento com data, valor ou classificação inválida.");
    }
  }

  return dados;
}

async function analisarPagina(arquivo, pdf, numero, referencia) {
  if (!pdf) return validarPagina(await api("pagina", await carregarFoto(arquivo), referencia));

  const partes = await lerPagina(arquivo, pdf, numero);
  let erroTexto;

  if (partes.texto.length >= 60 && partes.texto.length <= 65000) {
    try {
      return validarPagina(await api("pagina", partes, referencia));
    } catch (erro) {
      if (erroDeAcesso(erro)) throw erro;
      erroTexto = erro;
    }
  }

  try {
    return validarPagina(await api("pagina", await lerPagina(arquivo, pdf, numero, "visual"), referencia));
  } catch (erro) {
    if (erroDeAcesso(erro) || !erroTexto) throw erro;
    throw Error(`Texto: ${erroTexto.message} Imagem: ${erro.message}`);
  }
}

function encontrarLacunas(meses) {
  if (meses.length < 2) return [];

  const vistos = new Set(meses);
  const lacunas = [];
  let [ano, mes] = meses[0].split("-").map(Number);
  const [anoFinal, mesFinal] = meses.at(-1).split("-").map(Number);

  while (ano < anoFinal || ano === anoFinal && mes < mesFinal) {
    if (++mes === 13) { mes = 1; ano++; }
    const chave = `${String(ano).padStart(4, "0")}-${String(mes).padStart(2, "0")}`;
    if (!vistos.has(chave)) lacunas.push(chave);
  }
  return lacunas;
}

function consolidar(arquivos) {
  const meses = new Set();
  const linhas = [];
  const coincidencias = new Map();
  const porArquivo = [];

  for (const arquivo of arquivos) {
    const identificados = new Set();
    const periodos = new Set();

    for (const pagina of arquivo.paginas) {
      for (const mes of pagina.meses) identificados.add(mes);
      if (typeof pagina.periodo === "string" && pagina.periodo.trim()) {
        periodos.add(pagina.periodo.trim());
      }

      for (const t of pagina.transacoes) {
        identificados.add(t.data.slice(0, 7));
        const linha = { ...t, origem: pagina.origem, motivo: String(t.motivo || "") };
        linhas.push(linha);

        const chaves = [`valor:${t.data}|${t.centavos}`];
        const id = String(t.id_bancario || "").trim();
        if (id) chaves.push(`id:${id}`);

        for (const chave of chaves) {
          if (!coincidencias.has(chave)) coincidencias.set(chave, []);
          coincidencias.get(chave).push(linha);
        }
      }
    }

    for (const mes of identificados) meses.add(mes);
    porArquivo.push({
      nome: arquivo.nome, quantidade: arquivo.paginas.length,
      meses: [...identificados].sort(), periodos: [...periodos]
    });
  }

  if (!meses.size) throw Error("Nenhum período bancário foi identificado nos arquivos lidos.");

  for (const iguais of coincidencias.values()) {
    if (iguais.length < 2) continue;
    for (const linha of iguais) {
      linha.coincidencia = true;
      linha.status = "REVISAR";
    }
  }

  const ordenados = [...meses].sort();
  linhas.sort((a, b) => a.data.localeCompare(b.data) || a.centavos - b.centavos);
  return { meses: ordenados, lacunas: encontrarLacunas(ordenados), linhas, porArquivo };
}

async function apurar() {
  if (!pessoa || !liberado) throw Error("Confirme o documento e os extratos.");
  const finalidade = el("finalidade").value;
  if (!finalidade) throw Error("Selecione aluguel ou financiamento.");

  const referencia = { ...pessoa };
  for (const campo of familiares) referencia[campo] = el(campo).value.trim();

  invalidarResultado();
  const arquivos = Array.from(el("extratos").files);
  const processados = [];

  for (const [indice, arquivo] of arquivos.entries()) {
    const pdf = await abrirPDF(arquivo);
    const paginas = [];

    try {
      const quantidade = pdf?.numPages || 1;
      for (let numero = 1; numero <= quantidade; numero++) {
        const origem = `${arquivo.name} · pág. ${numero}`;
        const chave = JSON.stringify([indice, numero, referencia]);
        avisar(`Arquivo ${indice + 1}/${arquivos.length} · página ${numero}/${quantidade}\n${arquivo.name}`);

        if (!leituras.has(chave)) {
          const primeira = paginas[0];
          const anterior = paginas.at(-1);
          const contexto = {
            ...referencia, numeroPagina: numero, totalPaginas: quantidade,
            periodoInformadoNaCapa: String(primeira?.periodo || "").slice(0, 200),
            mesesJaIdentificadosNesteArquivo: [...new Set([
              ...(primeira?.meses || []), ...(anterior?.meses || [])
            ])].slice(0, 24)
          };

          try {
            const dados = await analisarPagina(arquivo, pdf, numero, contexto);
            leituras.set(chave, { ...dados, origem });
          } catch (erro) {
            throw Error(`${origem} · ${erro.message}\nMantenha a aba aberta e clique em Ler extratos e apurar renda para retomar.`);
          }
        }

        paginas.push(leituras.get(chave));
      }
    } finally {
      await pdf?.destroy();
    }
    processados.push({ nome: arquivo.name, paginas });
  }

  relatorio = { ...consolidar(processados), referencia, finalidade };
  mostrarResultado();
  avisar("Leitura concluída. O período foi identificado a partir dos extratos.");
}

function celula(linha, texto) {
  const td = document.createElement("td");
  td.textContent = texto;
  linha.append(td);
  return td;
}

function mostrarResultado() {
  const { meses, lacunas, porArquivo, linhas } = relatorio;
  el("cobertura").textContent =
    `${mesBR(meses[0])} a ${mesBR(meses.at(-1))} · ${meses.length} mês(es) documentado(s) · ${linhas.length} crédito(s)`;

  const lista = el("coberturaArquivos");
  lista.replaceChildren();
  for (const arquivo of porArquivo) {
    const item = document.createElement("li");
    const periodo = arquivo.meses.length ? arquivo.meses.map(mesBR).join(", ") : "período não identificado";
    item.textContent = `${arquivo.nome} · ${arquivo.quantidade} página(s) · ${periodo}` +
      (arquivo.periodos.length ? ` · indicação no extrato: ${arquivo.periodos.join(" | ")}` : "");
    lista.append(item);
  }

  el("lacunas").hidden = !lacunas.length;
  el("lacunas").textContent = lacunas.length
    ? `Meses sem documentação entre os períodos encontrados: ${lacunas.map(mesBR).join(", ")}.`
    : "";

  const fragmento = document.createDocumentFragment();
  for (const t of linhas) {
    const tr = document.createElement("tr");
    celula(tr, `${dataBR(t.data)} · ${t.origem}`);
    celula(tr, [t.descricao, t.motivo,
      t.coincidencia ? "Possível repetição. Confira a origem." : "",
      t.id_bancario ? `ID ${t.id_bancario}` : ""
    ].filter(Boolean).join(" · "));
    celula(tr, moeda(t.centavos)).className = "valor";

    const select = document.createElement("select");
    select.setAttribute("aria-label", `Decisão sobre ${t.descricao}`);
    for (const decisao of decisoes) select.add(new Option(decisao, decisao));
    select.value = t.status;
    select.addEventListener("change", () => {
      t.status = select.value;
      t.manual = true;
      atualizarResumo();
    });
    celula(tr, "").append(select);
    fragmento.append(tr);
  }

  el("linhas").replaceChildren(fragmento);
  el("revisao").hidden = false;
  atualizarResumo();
}

function calcular() {
  const mensal = new Map(relatorio.meses.map(mes => [mes, 0]));
  let aceitos = 0;
  let rejeitados = 0;
  let pendentes = 0;

  for (const t of relatorio.linhas) {
    if (t.status === "REVISAR") { pendentes++; continue; }
    if (t.status === "REJEITADO") { rejeitados += t.centavos; continue; }
    const mes = t.data.slice(0, 7);
    aceitos += t.centavos;
    mensal.set(mes, mensal.get(mes) + t.centavos);
  }
  return { mensal, aceitos, rejeitados, pendentes, media: Math.round(aceitos / mensal.size) };
}

function atualizarResumo() {
  const r = calcular();
  el("pendencias").textContent = r.pendentes
    ? `${r.pendentes} lançamento(s) aguardando revisão. Valores parciais.`
    : "";
  el("totais").textContent = `Considerado ${moeda(r.aceitos)} · Rejeitado ${moeda(r.rejeitados)} · Média mensal ${moeda(r.media)}`;
  controles();
}

function gerarPDF() {
  if (!relatorio) throw Error("Faça a apuração primeiro.");
  const r = calcular();
  if (r.pendentes) throw Error("Conclua a revisão das entradas.");
  if (!window.jspdf?.jsPDF) throw Error("A biblioteca de PDF não carregou.");

  const doc = new window.jspdf.jsPDF();
  if (typeof doc.autoTable !== "function") throw Error("A biblioteca de tabelas não carregou.");
  const dados = relatorio.referencia;
  const financiamento = relatorio.finalidade === "financiamento";
  const estilo = {
    margin: { left: 14, right: 14, top: 30, bottom: 16 },
    headStyles: { fillColor: [34, 32, 29], textColor: [246, 223, 170] },
    styles: { font: "helvetica", fontSize: 8, cellPadding: 2.2 },
    showHead: "everyPage"
  };

  doc.autoTable({
    ...estilo, startY: 30,
    head: [["Identificação", financiamento ? "Financiamento" : "Aluguel"]],
    body: [
      ["Titular", dados.titular], ["Pai", dados.pai || "Não informado"],
      ["Mãe", dados.mae || "Não informada"], ["Cônjuge", dados.conjuge || "Não informado"],
      ["Meses documentados", String(relatorio.meses.length)],
      ["Lacunas no período", relatorio.lacunas.map(mesBR).join(", ") || "Nenhuma identificada"]
    ]
  });

  doc.autoTable({
    ...estilo, startY: doc.lastAutoTable.finalY + 6,
    head: [["Mês", "Entradas consideradas"]],
    body: [...r.mensal].map(([mes, valor]) => [mesBR(mes), moeda(valor)]),
    foot: [["Total considerado", moeda(r.aceitos)], ["Total rejeitado", moeda(r.rejeitados)],
      ["Média por mês documentado", moeda(r.media)]],
    showFoot: "lastPage",
    footStyles: { fillColor: [244, 239, 227], textColor: [35, 35, 35] },
    columnStyles: { 1: { halign: "right" } }
  });

  if (financiamento && relatorio.linhas.length) {
    doc.addPage();
    doc.autoTable({
      ...estilo, startY: 30,
      head: [["Data", "Lançamento e origem", "Valor", "Decisão e motivo"]],
      body: relatorio.linhas.map(t => [
        dataBR(t.data), `${t.descricao}\n${t.origem}`, moeda(t.centavos),
        [t.status, t.manual ? "Conferência manual" : "", t.motivo].filter(Boolean).join("\n")
      ]),
      columnStyles: { 0: { cellWidth: 20 }, 2: { cellWidth: 25, halign: "right" }, 3: { cellWidth: 48 } }
    });
  }

  const total = doc.getNumberOfPages();
  for (let pagina = 1; pagina <= total; pagina++) {
    doc.setPage(pagina);
    doc.setFillColor(22, 22, 22);
    doc.rect(0, 0, 210, 22, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.setTextColor(225, 198, 139);
    doc.text("M&IC | Apuração de renda", 14, 14);
    doc.setFontSize(8);
    doc.setTextColor(90, 90, 90);
    doc.text(`Página ${pagina} de ${total}`, 196, 290, { align: "right" });
  }

  const titular = dados.titular.replace(/[^\p{L}\p{N} -]/gu, "").trim() || "Titular";
  return { doc, nome: `Apuracao de renda - ${titular}.pdf` };
}

el("documento").addEventListener("change", () => {
  invalidarPessoa();
  for (const campo of ["titular", "cpf", ...familiares]) el(campo).value = "";
  avisar("Clique em Ler documento.");
  controles();
});

for (const campo of ["titular", "cpf"]) {
  el(campo).addEventListener("input", () => {
    if (pessoa) {
      invalidarPessoa();
      avisar("Identificação alterada. Confirme o documento novamente.");
    }
    controles();
  });
}

el("extratos").addEventListener("change", () => {
  invalidarExtratos();
  avisar(`${el("extratos").files.length} arquivo(s) selecionado(s). Confira a titularidade.`);
  controles();
});

el("grupos").addEventListener("change", () => {
  if (!liberado) return;
  liberado = false;
  el("secaoApuracao").hidden = true;
  el("confirmarPendencias").hidden = false;
  invalidarResultado();
  avisar("Conferência alterada. Confirme os grupos pendentes.");
  controles();
});

el("certidao").addEventListener("change", controles);
for (const campo of [...familiares, "finalidade"]) {
  el(campo).addEventListener("input", () => {
    if (relatorio) {
      invalidarResultado();
      avisar("Dados alterados. Clique novamente em Ler extratos e apurar renda.");
    }
    controles();
  });
}

el("lerDocumento").onclick = () => executar(lerDocumento);
el("confirmarDocumento").onclick = () => executar(confirmarDocumento);
el("conferir").onclick = () => executar(conferirExtratos);
el("confirmarPendencias").onclick = () => executar(confirmarPendencias);
el("lerCertidao").onclick = () => executar(lerCertidao);
el("apurar").onclick = () => executar(apurar);

el("baixar").onclick = () => executar(() => {
  const { doc, nome } = gerarPDF();
  doc.save(nome);
  avisar("PDF gerado.");
});

el("compartilhar").onclick = () => executar(async () => {
  const { doc, nome } = gerarPDF();
  const arquivo = new File([doc.output("blob")], nome, { type: "application/pdf" });
  if (navigator.canShare?.({ files: [arquivo] })) {
    try {
      await navigator.share({ files: [arquivo], title: "Apuração de renda M&IC" });
    } catch (erro) {
      if (erro.name !== "AbortError") throw erro;
      avisar("Compartilhamento cancelado.");
    }
  } else {
    doc.save(nome);
    avisar("PDF baixado. Você pode anexá-lo no WhatsApp.");
  }
});

el("nova").onclick = () => {
  if (el("documento").files.length && !confirm("Encerrar a análise e limpar o progresso?")) return;
  senha = "";
  invalidarPessoa();
  for (const campo of ["documento", "extratos", "certidao", "finalidade",
    "titular", "cpf", ...familiares]) el(campo).value = "";
  avisar("Anexe o documento oficial.");
  controles();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
controles();
</script>
