<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apurador de Renda IA — M&IC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
  </script>
  <style>
    :root {
      --primary: #121315; --secondary: #1a1c20; --accent: #c59b27;
      --gold: #d4af37; --gold-light: #dfba48; --silver: #cfd4dc;
      --bg: #f4f5f7; --card: #ffffff; --text: #1a1a1a; --border: #e0e0e0;
      --success: #28a745; --danger: #dc3545; --warning: #e67e22;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: var(--bg); color: var(--text); }
    .main-header { background: linear-gradient(135deg, #0d0e10 0%, #1a1c20 70%, #2b261b 100%); border-bottom: 3px solid var(--accent); color: #fff; padding: 16px; }
    .section-banner { background: linear-gradient(90deg, #121315, #24272c); border-left: 4px solid var(--accent); color: var(--gold-light); }
    .btn-gold { background: linear-gradient(135deg, #c59b27, #dfba48); color: #121315; border: 1px solid #b88d1e; font-weight: 700; }
    .btn-gold:hover { filter: brightness(1.05); }
    .card-box { background-color: var(--card); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .loader-gold { border-top-color: var(--gold); animation: spinner 0.8s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .app-header-logo { height: 80px; width: auto; max-width: 200px; object-fit: contain; display: block; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  </style>
</head>
<body class="min-h-screen pb-16">

  <header class="main-header shadow-md sticky top-0 z-30">
    <div class="mx-auto flex flex-col items-center text-center w-full" style="max-width: 650px;">
      <img src="logo.png" alt="M&IC Corretores" class="app-header-logo mb-2.5">
      <div class="w-full">
        <h1 class="font-bold text-sm leading-tight tracking-wide" style="color: var(--gold);">APURAÇÃO DE RENDA POR IA</h1>
        <p class="text-[9px] uppercase tracking-wider mt-0.5" style="color: var(--silver);">M&IC Corretores de Imóveis</p>
      </div>
    </div>
  </header>

  <main class="mx-auto p-4 space-y-4" style="max-width: 650px;">

    <div id="statusAlert" class="hidden text-xs p-3.5 rounded-xl shadow-lg border flex items-center gap-3" style="background-color: var(--secondary); border-color: var(--accent); color: var(--silver);">
      <div class="loader-gold rounded-full border-2 border-t-2 border-slate-600 h-4 w-4 flex-shrink-0"></div>
      <span id="statusAlertTxt" class="font-medium tracking-wide">Processando...</span>
    </div>

    <!-- PASSO 1: Extratos -->
    <div class="card-box p-4">
      <div class="section-banner px-3 py-1.5 rounded-md mb-3 flex items-center justify-between">
        <h2 class="font-bold text-xs tracking-wider uppercase">1. Extratos Bancários</h2>
        <span class="text-[9px] px-2 py-0.5 rounded font-bold uppercase text-white" style="background-color: var(--success);">Obrigatório</span>
      </div>
      <input type="file" id="extratosInput" multiple accept="image/*,application/pdf" class="block w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-slate-100" />
      <div id="fileCounter" class="mt-2 text-[11px]" style="color: #888;">Nenhum arquivo selecionado.</div>
    </div>

    <!-- PASSO 2: Documento -->
    <div class="card-box p-4">
      <div class="section-banner px-3 py-1.5 rounded-md mb-3 flex items-center justify-between">
        <h2 class="font-bold text-xs tracking-wider uppercase">2. Documento do Cliente (CNH / Certidão)</h2>
        <span class="text-[9px] px-2 py-0.5 rounded font-bold uppercase" style="background: rgba(207, 212, 220, 0.15); color: var(--silver);">Opcional</span>
      </div>
      <input type="file" id="docInput" accept="image/*,application/pdf" capture="environment" class="block w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-slate-100" />
      <button type="button" onclick="lerDocumentoCliente()" class="btn-gold text-xs px-3.5 py-2 rounded-lg mt-3 shadow-sm">Ler Foto/Doc</button>
      
      <div class="space-y-2.5 pt-3 mt-3 border-t" style="border-color: var(--border);">
        <div><label class="block text-[11px] font-bold uppercase mb-1">Nome do Cliente (Titular)</label><input type="text" id="titularName" class="w-full text-xs border rounded-lg px-3 py-2 bg-slate-50 font-semibold" /></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-[11px] font-bold uppercase mb-1">Pai</label><input type="text" id="paiName" class="w-full text-xs border rounded-lg px-3 py-2 bg-slate-50" /></div>
          <div><label class="block text-[11px] font-bold uppercase mb-1">Mãe</label><input type="text" id="maeName" class="w-full text-xs border rounded-lg px-3 py-2 bg-slate-50" /></div>
        </div>
        <div><label class="block text-[11px] font-bold uppercase mb-1">Cônjuge</label><input type="text" id="conjugeName" class="w-full text-xs border rounded-lg px-3 py-2 bg-slate-50" /></div>
      </div>
    </div>

    <button id="btnProcessar" onclick="executarApuracaoRenda()" class="w-full btn-gold py-3.5 px-4 rounded-xl shadow-md text-sm uppercase tracking-wider">Executar Apuração Visual via IA</button>

    <div id="resultadoBox" class="hidden space-y-3 pt-1">
      <div class="card-box p-4 text-center space-y-2 border" style="border-color: var(--accent);">
        <h3 class="font-bold text-sm tracking-wider uppercase">Apuração Concluída com Sucesso</h3>
        <p class="text-[11px]" style="color: #666;">O Laudo Pericial A4 foi gerado e está pronto.</p>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="gerarECompartilharPDF()" class="btn-gold py-3 px-3 rounded-xl text-xs uppercase">Compartilhar</button>
        <button onclick="baixarPDFLocal()" class="w-full text-white font-bold py-3 px-3 rounded-xl text-xs uppercase" style="background-color: var(--secondary);">Baixar PDF</button>
      </div>
      <button onclick="resetarParaNovaAnalise()" class="w-full py-3 px-4 bg-white font-bold rounded-xl text-xs uppercase border">Nova Análise</button>
    </div>

  </main>

  <script>
    let consolidadoMeses = [], dadosCliente = {};

    function showStatus(msg) { document.getElementById('statusAlert').classList.remove('hidden'); document.getElementById('statusAlertTxt').innerText = msg; }
    function hideStatus() { document.getElementById('statusAlert').classList.add('hidden'); }

    document.getElementById('extratosInput').addEventListener('change', function(e) {
      document.getElementById('fileCounter').innerText = e.target.files.length > 0 ? `${e.target.files.length} arquivo(s)` : 'Nenhum arquivo.';
    });

    async function otimizarFotoBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 1200; let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) { if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; } else { w = Math.round(w * maxDim / h); h = maxDim; } }
            const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.80).split(',')[1]);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function extrairDadosCompletosPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let imagens = [], texto = "";
      for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
        const page = await pdf.getPage(i);
        const txt = await page.getTextContent();
        texto += txt.items.map(it => it.str).join(" ") + "\n";
        const viewport = page.getViewport({ scale: 1.0 });
        const canvas = document.createElement('canvas'); canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        imagens.push(canvas.toDataURL('image/jpeg', 0.75).split(',')[1]);
      }
      return { texto: texto.trim(), imagens };
    }

    async function chamarApiServidor(payload) {
      const res = await fetch('/api/audit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erro no servidor de IA da Vercel");
      return data;
    }

    async function lerDocumentoCliente() {
      const file = document.getElementById('docInput').files[0];
      if (!file) { alert("Selecione o documento."); return; }
      showStatus("Lendo documento...");
      try {
        const resPdf = file.type.includes('pdf') || file.name.endsWith('.pdf') ? await extrairDadosCompletosPDF(file) : { texto: "", imagens: [await otimizarFotoBase64(file)] };
        const titularExtrato = document.getElementById('titularName').value.trim();
        const prompt = `Analise esta CNH ou Certidão de Casamento. Titular do extrato: "${titularExtrato}". Retorne EXCLUSIVAMENTE um JSON com as chaves exatas: {"titular": "...", "pai": "...", "mae": "...", "conjuge": "..."}`;
        
        const json = await chamarApiServidor({ prompt, texts: resPdf.texto, images: resPdf.imagens });
        if (json.titular) document.getElementById('titularName').value = json.titular;
        if (json.pai) document.getElementById('paiName').value = json.pai;
        if (json.mae) document.getElementById('maeName').value = json.mae;
        if (json.conjuge) document.getElementById('conjugeName').value = json.conjuge;
      } catch (err) { alert("Erro ao ler documento: " + err.message); } finally { hideStatus(); }
    }

    async function executarApuracaoRenda() {
      const files = document.getElementById('extratosInput').files;
      if (!files.length) { alert("Adicione os extratos."); return; }
      dadosCliente = { titular: document.getElementById('titularName').value.trim(), pai: document.getElementById('paiName').value.trim(), mae: document.getElementById('maeName').value.trim(), conjuge: document.getElementById('conjugeName').value.trim() };
      showStatus("Processando extratos...");
      try {
        let imagens = [], textoGeral = "";
        for (let file of Array.from(files)) {
          if (file.type.includes('pdf') || file.name.endsWith('.pdf')) {
            const res = await extrairDadosCompletosPDF(file);
            textoGeral += res.texto; res.imagens.forEach(img => imagens.push(img));
          } else { imagens.push(await otimizarFotoBase64(file)); }
        }
        const prompt = `Audite entradas bancárias considerando Titular: "${dadosCliente.titular}", Pai: "${dadosCliente.pai}", Mãe: "${dadosCliente.mae}", Cônjuge: "${dadosCliente.conjuge}". Ignore salário formal, resgates de cofrinho, mesma titularidade e familiares. Retorne EXCLUSIVAMENTE um JSON: {"resumo_geral": {"total_entradas_consideradas": 0, "total_entradas_descartadas": 0, "quantidade_meses": 1, "renda_media_mensal": 0}, "apuracao_mensal": [{"mes_ano": "MM/AAAA", "somatorio_entradas": 0}], "transacoes": []}`;
        
        const json = await chamarApiServidor({ prompt, texts: textoGeral, images: imagens });
        window.ultimoResultado = json;
        consolidadoMeses = json.apuracao_mensal || [];
        document.getElementById('resultadoBox').classList.remove('hidden');
      } catch (err) { alert("Erro: " + err.message); } finally { hideStatus(); }
    }

    function formatMoeda(val) { return (Number(val) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

    function carregarImagemBase64(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = function() {
          const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height;
          canvas.getContext('2d').drawImage(img, 0, 0);
          resolve(canvas.toDataURL('image/jpeg'));
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    async function gerarDocumentoPDF() {
      const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const resumo = window.ultimoResultado.resumo_geral, titular = dadosCliente.titular || "Não especificado";

      const logoBase64 = await carregarImagemBase64('logo.png');
      if (logoBase64) { try { doc.addImage(logoBase64, 'JPEG', 11, 6, 26, 13); } catch(e) {} }

      doc.setFillColor(18, 19, 21); doc.rect(0, 0, 210, 26, 'F');
      doc.setFillColor(197, 155, 39); doc.rect(0, 26, 210, 1.2, 'F');
      doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(212, 175, 55);
      doc.text("LAUDO PERICIAL DE APURAÇÃO DE RENDA BANCÁRIA", 40, 12);
      doc.setFontSize(7.5); doc.setFont("helvetica", "normal"); doc.setTextColor(207, 212, 220);
      doc.text("M&IC Corretores de Imóveis — Auditoria Óptica e Visão Computacional", 40, 19);
      doc.text(`Emissão: ${new Date().toLocaleDateString('pt-BR')}`, 162, 19);

      // Marca d'água centralizada e em pé (sem rotação)
      const watermarkBase64 = await carregarImagemBase64('marca-dagua.png');
      if (watermarkBase64) {
        try { 
          doc.addImage(watermarkBase64, 'PNG', 55, 100, 100, 100, '', 'FAST', 0); 
        } catch(e) {}
      }

      doc.setFillColor(18, 19, 21); doc.rect(11, 33, 188, 7, 'F'); doc.setFillColor(197, 155, 39); doc.rect(11, 33, 2, 7, 'F');
      doc.setFontSize(8); doc.setFont("helvetica", "bold"); doc.setTextColor(223, 186, 72);
      doc.text("1. IDENTIFICAÇÃO DO TITULAR E FILTROS DE EXCLUSÃO", 16, 38);

      doc.setDrawColor(224, 224, 224); doc.setFillColor(255, 255, 255); doc.rect(11, 40, 188, 17, 'FD');
      doc.setFontSize(7.5); doc.setFont("helvetica", "normal"); doc.setTextColor(26, 26, 26);
      doc.text(`Titular da Conta: ${titular}`, 15, 45);
      doc.text(`Filiação Registrada: ${dadosCliente.pai || 'N/I'} e ${dadosCliente.mae || 'N/I'}`, 15, 50);
      doc.text(`Cônjuge / Vínculo Cadastrado: ${dadosCliente.conjuge || 'N/I'}`, 15, 55);

      doc.setFillColor(18, 19, 21); doc.rect(11, 62, 188, 7, 'F'); doc.setFillColor(197, 155, 39); doc.rect(11, 62, 2, 7, 'F');
      doc.setFontSize(8); doc.setFont("helvetica", "bold"); doc.setTextColor(223, 186, 72);
      doc.text("2. DEMONSTRATIVO CONSOLIDADO POR PERÍODO (MÊS / ANO)", 16, 67);

      doc.autoTable({
        startY: 70, head: [['Mês / Ano', 'Somatório das Entradas Consideradas']],
        body: consolidadoMeses.map(m => [m.mes_ano, formatMoeda(m.somatorio_entradas)]),
        headStyles: { fillColor: [250, 246, 236], textColor: [115, 87, 14], fontSize: 7.5, fontStyle: 'bold', lineColor: [204, 204, 204], lineWidth: 0.2 },
        bodyStyles: { fontSize: 7.2, textColor: [26, 26, 26], lineColor: [224, 224, 224], lineWidth: 0.2 },
        columnStyles: { 0: { fontStyle: 'bold', width: 60 }, 1: { halign: 'right', fontStyle: 'bold', textColor: [40, 167, 69] } },
        margin: { left: 11, right: 11 }, tableWidth: 188
      });

      let currentY = doc.lastAutoTable.finalY + 5;
      doc.setFillColor(244, 245, 247); doc.setDrawColor(197, 155, 39); doc.roundedRect(11, currentY, 188, 18, 2, 2, 'FD');
      doc.setFontSize(8); doc.setFont("helvetica", "bold"); doc.setTextColor(18, 19, 21);
      doc.text(`TOTAL CONSIDERADO: ${formatMoeda(resumo.total_entradas_consideradas)}`, 16, currentY + 7);
      doc.text(`MÉDIA MENSAL APURADA: ${formatMoeda(resumo.renda_media_mensal)}`, 16, currentY + 13);
      doc.setFont("helvetica", "normal"); doc.setTextColor(110, 110, 110);
      doc.text(`Total Descartado (Filtros): ${formatMoeda(resumo.total_entradas_descartadas)}`, 115, currentY + 7);
      doc.text(`Meses Analisados: ${resumo.quantidade_meses}`, 115, currentY + 13);

      return { doc, titular };
    }

    function resetarParaNovaAnalise() {
      document.getElementById('docInput').value = ''; document.getElementById('extratosInput').value = '';
      ['titularName', 'paiName', 'maeName', 'conjugeName'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fileCounter').innerText = 'Nenhum arquivo selecionado.';
      window.ultimoResultado = null; document.getElementById('resultadoBox').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function baixarPDFLocal() {
      if (!window.ultimoResultado) return;
      gerarDocumentoPDF().then(({ doc, titular }) => { doc.save(`Laudo_Renda_${titular.replace(/\s+/g, '_')}.pdf`); });
    }

    async function gerarECompartilharPDF() {
      if (!window.ultimoResultado) return;
      const { doc, titular } = await gerarDocumentoPDF();
      const pdfBlob = doc.output('blob');
      const pdfFile = new File([pdfBlob], `Laudo_Renda_${titular.replace(/\s+/g, '_')}.pdf`, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
        try { await navigator.share({ title: 'Laudo de Apuração de Renda', files: [pdfFile] }); } catch (e) { if (e.name !== 'AbortError') doc.save(); }
      } else { doc.save(); }
    }
  </script>
</body>
</html>
